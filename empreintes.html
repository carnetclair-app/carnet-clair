<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Carnet Clair · empreintes</title>
<style>body{margin:0;font:16px/1.45 system-ui,sans-serif;background:#121a17;color:#e9efe9}main{max-width:640px;margin:auto;padding:16px}
pre{white-space:pre-wrap;word-break:break-all;background:#1a2420;padding:12px;border-radius:10px;font-size:13px}
button{margin-top:12px;padding:12px 18px;border-radius:10px;border:0;background:#6fd0bd;color:#0f2a25;font-weight:700;font-size:16px}.mut{color:#9aa8a1;font-size:14px}</style></head>
<body><main><h1 style="font-size:22px">Empreintes des bibliothèques</h1>
<p class="mut">Cette page calcule l'empreinte de contrôle des deux bibliothèques utilisées par Carnet Clair. Appuyez sur « Copier », puis collez le texte dans la conversation avec Claude.</p>
<pre id="o">Calcul en cours…</pre><button id="c">Copier</button></main>
<script>
const L = ["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js", "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"];
(async () => {
  let t = "";
  for (const u of L) {
    try {
      const b = await (await fetch(u, { cache: "no-store" })).arrayBuffer();
      const h = new Uint8Array(await crypto.subtle.digest("SHA-384", b));
      let s = ""; h.forEach(x => s += String.fromCharCode(x));
      t += u.split("/npm/")[1] + "\n" + b.byteLength + " octets\nsha384-" + btoa(s) + "\n\n";
    } catch (e) { t += u + "\nERREUR : " + e.message + "\n\n"; }
  }
  document.getElementById("o").textContent = t.trim();
})();
document.getElementById("c").onclick = async () => { try { await navigator.clipboard.writeText(document.getElementById("o").textContent); document.getElementById("c").textContent = "Copié"; } catch (e) { alert("Faites un appui long sur le texte pour le copier."); } };
</script></body></html>
