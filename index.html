<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#17231f;--mut:#66726d;--line:#dcdcd2;--g:#0f4c45;--gt:#e3efe9;--o:#b9770e;--ot:#f8ecd3;--r:#b3372b;--rt:#f7e0dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--card:#1a2420;--ink:#e9efe9;--mut:#9aa8a1;--line:#2c3a35;--g:#6fd0bd;--gt:#1b3a34;--o:#e3a64a;--ot:#3a2e14;--r:#f08a7d;--rt:#3d1f1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:42px}
button.p{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:600}
button.d{color:var(--r)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:44px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.hero{background:var(--g);color:var(--bg);border-radius:18px;padding:20px;margin-bottom:14px}
.hero small{opacity:.8}
.hero .big{font-size:clamp(30px,9vw,46px);font-weight:800;line-height:1.1;margin:2px 0 10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:13px}
.row3 b{display:block;font-size:15px}
.bar{display:flex;gap:8px;margin:12px 0}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
.amt{font-weight:800;white-space:nowrap}
.c-o,.mut.c-o{color:var(--o)}.c-r,.mut.c-r{color:var(--r)}.c-g{color:var(--g)}
.row3 div.alert{background:var(--rt);color:var(--r)}.row3 div.plus{background:var(--gt);color:var(--g)}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;font-weight:600}
.ok{background:var(--gt);color:var(--g)}.wait{background:var(--ot);color:var(--o)}.late{background:var(--rt);color:var(--r)}
.mut{color:var(--mut);font-size:14px}
.sec{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);width:min(520px,94vw);padding:18px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ln{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:6px;margin-bottom:6px}
.ln input.miss{border-color:var(--r);box-shadow:0 0 0 2px var(--rt)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
.wrap{overflow-x:auto}
.pw{position:relative}.pw input{padding-right:104px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:34px;padding:4px 10px;font-size:14px}
.hero .hz{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .hide{background:rgba(255,255,255,.18);color:inherit;border:none;min-height:34px;padding:4px 12px;font-size:14px;border-radius:99px}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px}
.chk input{width:auto;min-height:0;margin-top:4px}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%;color:#000}}

<body>
<main id="app"><p class="mut">Chargement…</p></main>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script>
"use strict";
/* ====== CONFIGURATION : remplacez ces deux lignes (voir GUIDE.md) ====== */
const SUPABASE_URL = "https://mphphohljjpqjwnrpuld.supabase.co";
const SUPABASE_KEY = "sb_publishable_Jz2Kt1WlETaj8tSbzbom0w_yZ5SEB-J";
/* ======================================================================= */

let sb = null, user = null, sub = null, isAdm = false, cid = null, cfgS = "", tab = "client";
let recovering = /type=recovery/.test(location.hash);
let locked = false, hiddenAt = 0, mfaPending = false;
/* Lien de confirmation ou de réinitialisation expiré : Supabase revient avec #error_code=… dans l'adresse. */
let authMsg = "";
(function () {
  const h = new URLSearchParams(location.hash.replace(/^#/, "") || location.search.replace(/^\?/, ""));
  const code = h.get("error_code") || (h.get("error") ? "x" : "");
  if (!code) return;
  authMsg = code === "otp_expired"
    ? "Ce lien a expiré ou a déjà servi. Entrez votre e-mail et votre mot de passe, puis « Se connecter » : si le compte n'est pas encore confirmé, vous pourrez recevoir un nouveau lien."
    : "Ce lien n'est pas valide. Connectez-vous, ou demandez un nouveau lien.";
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
})();
const authErr = msg => {
  const t = String(msg || "");
  if (/invalid login credentials/i.test(t)) return "E-mail ou mot de passe incorrect.";
  if (/email not confirmed/i.test(t)) return "Adresse e-mail pas encore confirmée. Ouvrez le dernier e-mail « Confirmez votre adresse » reçu, ou demandez-en un nouveau ci-dessous.";
  if (/already registered/i.test(t)) return "Un compte existe déjà avec cette adresse : utilisez « Se connecter ».";
  if (/rate limit|too many/i.test(t)) return "Trop de tentatives. Patientez quelques minutes, puis réessayez.";
  return "Échec : " + t;
};
let hideAmt = false; try { hideAmt = localStorage.getItem("cc_hide_amounts") === "1"; } catch (e) {}
const mfmt = n => hideAmt ? "•••••• " + S.cur : fmt(n);
let S = { clients: [], invoices: [], payments: [], cur: "GNF", shop: "" };
let syn = { clients: {}, invoices: {}, payments: {} };
const $ = s => document.querySelector(s);
const app = h => { $("#app").innerHTML = h; addEyes($("#app")); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fd = d => d ? d.split("-").reverse().join("/") : "";
const fmt = n => Math.round(n).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g, " ") + " " + S.cur;
const tot = i => i.items.reduce((a, l) => a + l.q * l.p, 0);
const uuid = () => crypto.randomUUID();
/* Devise : lettres ou symbole seulement (jamais de chiffres, sinon « 650000 » s'affiche après chaque montant). */
const cleanCur = c => String(c == null ? "" : c).replace(/[^A-Za-z\u00C0-\u024F\u0600-\u06FF .$€£-]/g, "").replace(/[\u0660-\u0669\u06F0-\u06F9]/g, "").trim().slice(0, 8) || "GNF";

/* ---------- Abonnement ---------- */
function subInfo() {
  if (!sub) return { ok: true, text: "", cls: "ok" };
  const t = Date.parse(sub.trial_ends), p = sub.paid_until ? Date.parse(sub.paid_until) : 0;
  const end = Math.max(t, p), days = Math.ceil((end - Date.now()) / 864e5);
  if (end < Date.now()) return { ok: false, text: "Abonnement expiré : lecture seule. Contactez le prestataire pour renouveler.", cls: "late" };
  return { ok: true, text: (p >= t ? "Abonnement actif jusqu'au " : "Essai gratuit jusqu'au ") + fd(new Date(end).toISOString().slice(0, 10)) + " (" + days + " j)", cls: days <= 5 ? "wait" : "ok" };
}
const active = () => subInfo().ok;

/* ---------- Calculs ---------- */
function calc(id) {
  const inv = S.invoices.filter(i => i.cid === id).sort((a, b) => a.date < b.date ? -1 : 1);
  let pool = S.payments.filter(p => p.cid === id).reduce((a, p) => a + p.amt, 0);
  const paidAll = pool; let billed = 0, due = 0, late = 0;
  inv.forEach(i => {
    i.total = tot(i); i.paid = Math.min(i.total, pool); pool -= i.paid; i.rest = i.total - i.paid;
    const over = i.rest > 0 && i.due && i.due < today();
    i.st = i.rest === 0 ? ["Payée", "ok"] : over ? ["En retard", "late"] : i.paid > 0 ? ["Partielle", "wait"] : ["À payer", "wait"];
    billed += i.total; due += i.rest; if (over) late += i.rest;
  });
  return { inv, billed, paid: paidAll, due, late, credit: pool };
}
function all(kind) { const t = { b: 0, p: 0, d: 0, l: 0 }; S.clients.filter(c => (c.kind || "client") === kind).forEach(c => { const x = calc(c.id); t.b += x.billed; t.p += x.paid; t.d += x.due; t.l += x.late; }); return t; }
function nextNo(kind) { const p = (kind === "fournisseur" ? "A" : "F") + new Date().getFullYear() + "-"; let max = 0; S.invoices.forEach(i => { if (String(i.no).indexOf(p) === 0) { const n = parseInt(String(i.no).slice(p.length), 10); if (n > max) max = n; } }); return p + String(max + 1).padStart(3, "0"); }
function curKind() { const c = S.clients.find(c => c.id === cid); return c && c.kind === "fournisseur" ? "fournisseur" : "client"; }

/* ---------- Base de données ---------- */
function row(col, o) {
  if (col === "clients") return { id: o.id, name: o.name, phone: o.phone || "", note: o.note || "", kind: o.kind || "client", share_token: o.share || null };
  if (col === "invoices") return { id: o.id, client_id: o.cid, no: o.no, date: o.date, due: o.due || null, items: o.items };
  return { id: o.id, client_id: o.cid, date: o.date, amt: o.amt, method: o.method, note: o.note || "" };
}
function resetSyn() { ["clients", "invoices", "payments"].forEach(c => { syn[c] = {}; S[c].forEach(o => { syn[c][o.id] = JSON.stringify(row(c, o)); }); }); }

let queue = Promise.resolve();
function save() { queue = queue.then(doSave).catch(e => { alert("Erreur d'enregistrement : " + (e.message || e)); return loadAll(false); }); return queue; }
async function doSave() {
  if (!active()) { alert("Abonnement expiré : lecture seule. Contactez le prestataire."); return loadAll(false); }
  for (const col of ["clients", "invoices", "payments"]) {
    const up = [];
    S[col].forEach(o => { const r = row(col, o); if (syn[col][o.id] !== JSON.stringify(r)) up.push(r); });
    if (up.length) { const { error } = await sb.from(col).upsert(up); if (error) throw error; up.forEach(r => { syn[col][r.id] = JSON.stringify(r); }); }
  }
  for (const col of ["payments", "invoices", "clients"]) {
    const del = Object.keys(syn[col]).filter(id => !S[col].some(o => o.id === id));
    if (del.length) { const { error } = await sb.from(col).delete().in("id", del); if (error) throw error; del.forEach(id => { delete syn[col][id]; }); }
  }
  const c = JSON.stringify({ shop: S.shop, cur: S.cur });
  if (c !== cfgS) { const { error } = await sb.from("profiles").upsert({ user_id: user.id, shop: S.shop, cur: S.cur }); if (error) throw error; cfgS = c; }
}

async function loadAll(first) {
  if (mfaPending) return; /* tant que le code Authenticator n'est pas validé, aucune donnée n'est chargée */
  if (first) app('<p class="mut">Chargement…</p>');
  const r = await Promise.all([
    sb.from("clients").select("*"), sb.from("invoices").select("*"), sb.from("payments").select("*"),
    sb.from("profiles").select("*").eq("user_id", user.id).maybeSingle(),
    sb.from("subscriptions").select("*").eq("user_id", user.id).maybeSingle(),
    sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle()
  ]);
  const err = r.find(x => x.error);
  if (err) { app(`<div class="empty">Erreur de chargement : ${esc(err.error.message)}</div><div class="acts"><button id="rt">Réessayer</button><button id="lo">Se déconnecter</button></div>`); $("#rt").onclick = () => loadAll(true); $("#lo").onclick = () => sb.auth.signOut(); return; }
  S.clients = r[0].data.map(x => ({ id: x.id, name: x.name, phone: x.phone, note: x.note, kind: x.kind || "client", share: x.share_token || null }));
  S.invoices = r[1].data.map(x => ({ id: x.id, cid: x.client_id, no: x.no, date: x.date, due: x.due || "", items: x.items }));
  S.payments = r[2].data.map(x => ({ id: x.id, cid: x.client_id, date: x.date, amt: Number(x.amt), method: x.method, note: x.note || "" }));
  const p = r[3].data; S.shop = p ? p.shop : ""; S.cur = p ? cleanCur(p.cur) : "GNF"; cfgS = JSON.stringify({ shop: S.shop, cur: S.cur });
  sub = r[4].data; isAdm = !!r[5].data;
  resetSyn(); render();
}

/* ---------- Connexion ---------- */
function renderAuth(mode) {
  mode = mode || "in";
  app(`<div class="top"><h1>Carnet Clair</h1></div>
  <div class="hero"><small>Suivez vos clients, vos factures et vos paiements</small><div class="big" style="font-size:24px">${mode === "in" ? "Connexion" : "Créer mon compte"}</div></div>
  <label for="ae">E-mail</label><input id="ae" type="email" autocomplete="email" inputmode="email">
  <label for="ap">${mode === "in" ? "Mot de passe" : "Mot de passe (8 caractères minimum, avec majuscule, minuscule et chiffre)"}</label><input id="ap" type="password" autocomplete="${mode === "in" ? "current-password" : "new-password"}">
  ${mode === "up" ? '<label class="chk" style="margin-top:12px"><input type="checkbox" id="at"><span>J\'accepte les conditions d\'utilisation et la politique de confidentialité.</span></label>' : ""}
  <p class="mut" id="am">${esc(authMsg)}</p>
  <div class="acts" id="ars" style="display:none"><button id="arsb">Renvoyer l'e-mail de confirmation</button></div>
  <div class="acts"><button class="p" id="ago">${mode === "in" ? "Se connecter" : "Créer mon compte"}</button><button id="asw">${mode === "in" ? "Créer un compte" : "J'ai déjà un compte"}</button></div>${mode === "in" ? '<p style="margin-top:12px"><button id="afg" style="border:none;background:none;text-decoration:underline;min-height:0;padding:6px 0">Mot de passe oublié ?</button></p>' : ""}`);
  $("#asw").onclick = () => renderAuth(mode === "in" ? "up" : "in");
  if ($("#afg")) $("#afg").onclick = () => renderReset();
  $("#ago").onclick = async () => {
    const email = $("#ae").value.trim(), password = $("#ap").value, m = $("#am");
    const minLen = mode === "up" ? 8 : 6;
    if (!email || password.length < minLen) { m.textContent = "Entrez un e-mail et un mot de passe de " + minLen + " caractères au moins."; return; }
    if (mode === "up" && !$("#at").checked) { m.textContent = "Vous devez accepter les conditions pour continuer."; return; }
    $("#ago").disabled = true; m.textContent = "Un instant…";
    const res = mode === "in" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
    $("#ago").disabled = false;
    authMsg = "";
    if (res.error) {
      m.textContent = authErr(res.error.message);
      if (/email not confirmed/i.test(res.error.message)) {
        $("#ars").style.display = "";
        $("#arsb").onclick = async () => {
          $("#arsb").disabled = true; m.textContent = "Un instant…";
          const r = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: location.origin + location.pathname } });
          $("#arsb").disabled = false;
          m.textContent = r.error ? authErr(r.error.message) : "Nouvel e-mail envoyé. Ouvrez-le dans l'heure, et seulement le plus récent.";
        };
      }
      return;
    }
    if (mode === "up" && !res.data.session) m.textContent = "Compte créé. Ouvrez l'e-mail « Confirmez votre adresse » dans l'heure qui suit (le plus récent s'il y en a plusieurs), puis connectez-vous.";
  };
}

/* ---------- Écrans ---------- */
function render() {
  if (!user) return renderAuth();
  if (locked) return renderLock();
  const si = subInfo(); let h = "";
  const banner = si.text ? `<p style="margin:-6px 0 12px"><span class="tag ${si.cls}">${esc(si.text)}</span></p>` : "";
  if (!cid) {
    const sup = tab === "fournisseur", t = all(tab), list = S.clients.filter(c => (c.kind || "client") === tab);
    h += `<div class="top"><h1>Carnet Clair</h1><button id="bk">Réglages</button></div>${banner}`;
    const lx = lastExport(), days = lx ? Math.floor((Date.now() - lx) / 864e5) : -1;
    if (S.invoices.length + S.payments.length > 0 && (days < 0 || days >= 7))
      h += `<div class="item" style="margin:0 0 12px;cursor:default"><span class="mut">${days < 0 ? "Aucune sauvegarde de vos données sur ce téléphone." : "Dernière sauvegarde il y a " + days + " jours."}</span><button id="bkx">Sauvegarder</button></div>`;
    h += `<div class="acts" style="margin:0 0 12px"><button id="tc" class="${sup ? "" : "p"}">Clients</button><button id="tf" class="${sup ? "p" : ""}">Fournisseurs</button></div>`;
    h += `<div class="hero"><div class="hz"><small>${sup ? "Reste à payer à mes fournisseurs" : "Reste à encaisser"}</small><button class="hide" id="hm" aria-label="${hideAmt ? "Afficher les montants" : "Masquer les montants"}">${hideAmt ? "Afficher" : "Masquer"}</button></div><div class="big">${mfmt(t.d)}</div><div class="row3"><div>${sup ? "Acheté" : "Facturé"}<b>${mfmt(t.b)}</b></div><div>${sup ? "Payé" : "Encaissé"}<b>${mfmt(t.p)}</b></div><div class="${t.l > 0 ? "alert" : ""}">En retard<b>${mfmt(t.l)}</b></div></div></div>`;
    h += `<div class="bar"><button class="p" id="nc">${sup ? "Nouveau fournisseur" : "Nouveau client"}</button></div>`;
    if (!list.length) h += `<div class="empty">${sup ? "Aucun fournisseur. Ajoutez un fournisseur, puis notez vos achats et vos paiements." : "Aucun client. Ajoutez votre premier client, puis créez sa première facture."}</div>`;
    else {
      h += `<div class="list">`;
      list.slice().sort((a, b) => calc(b.id).due - calc(a.id).due).forEach(c => {
        const x = calc(c.id);
        h += `<button class="item" data-c="${c.id}"><span><b>${esc(c.name)}</b><br><span class="mut">${x.inv.length} ${sup ? "achat(s)" : "facture(s)"}${x.late ? ' · <span class="tag late">En retard</span>' : ""}</span></span><span class="amt ${x.late ? "c-r" : x.due ? "c-o" : ""}">${x.due ? mfmt(x.due) : '<span class="tag ok">À jour</span>'}</span></button>`;
      });
      h += `</div>`;
    }
  } else {
    const c = S.clients.find(c => c.id === cid); if (!c) { cid = null; return render(); }
    const x = calc(cid), sup = c.kind === "fournisseur";
    h += `<div class="top"><button id="back">Retour</button><button id="ec">Modifier</button></div>${banner}`;
    h += `<h1>${esc(c.name)}</h1><div class="mut">${esc(c.phone || "Pas de téléphone")}${c.note ? " · " + esc(c.note) : ""}</div>`;

/* Sauvegarde : fichier téléchargé + copie à s'envoyer (Drive, WhatsApp, e-mail). La date est retenue sur ce téléphone. */
const bkKey = () => "cc_last_export_" + (user ? user.id : "");

function exportJson() {

  /* Chrome Android ne partage pas les fichiers .json : la copie à envoyer est la même sauvegarde, en .txt */
  const copy = new File([data], name.replace(/\.json$/, ".txt"), { type: "text/plain" });

/* Import : fusionne sans doublons (client, facture ou paiement déjà présent = ignoré) et retient ce qui a été ajouté pour pouvoir l'annuler. */
const impKey = () => "cc_last_import_" + (user ? user.id : "");
function lastImport() { try { return JSON.parse(localStorage.getItem(impKey()) || "null"); } catch (e) { return null; } }
function importData(o) {
  const m = {}, added = { clients: [], invoices: [], payments: [], at: Date.now() };
  const okDate = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d || "")) ? String(d) : "";
  const cleanItems = it => (Array.isArray(it) ? it : []).slice(0, 200).map(l => ({ d: String((l && l.d) || "").slice(0, 200), q: Number(l && l.q) || 0, p: Number(l && l.p) || 0 }));
  const ckey = c => (c.kind === "fournisseur" ? "f" : "c") + "|" + String(c.name || "").trim().toLowerCase() + "|" + String(c.phone || "").replace(/\D/g, "");
  const have = {}; S.clients.forEach(c => { have[ckey(c)] = c.id; });
  (o.clients || []).forEach(c => {
    const nc = { name: String(c.name || "Sans nom").slice(0, 120), phone: String(c.phone || "").slice(0, 40), note: String(c.note || "").slice(0, 500), kind: c.kind === "fournisseur" ? "fournisseur" : "client" };
    const k = ckey(nc);
    if (have[k]) { m[c.id] = have[k]; return; }
    const id = uuid(); m[c.id] = id; have[k] = id; S.clients.push(Object.assign({ id }, nc)); added.clients.push(id);
  });
  (o.invoices || []).forEach(i => {
    const cid = m[i.cid]; if (!cid) return;
    const no = String(i.no || "").slice(0, 40), date = okDate(i.date) || today();
    if (S.invoices.some(x => x.cid === cid && x.no === no && x.date === date)) return;
    const id = uuid(); S.invoices.push({ id, cid, no, date, due: okDate(i.due), items: cleanItems(i.items) }); added.invoices.push(id);
  });
  (o.payments || []).forEach(p => {
    const cid = m[p.cid]; if (!cid) return;
    const date = okDate(p.date) || today(), amt = +p.amt || 0, method = String(p.method || "Espèces").slice(0, 40);
    if (S.payments.some(x => x.cid === cid && x.date === date && +x.amt === amt && x.method === method)) return;
    const id = uuid(); S.payments.push({ id, cid, date, amt, method, note: String(p.note || "").slice(0, 500) }); added.payments.push(id);
  });
  if (added.clients.length + added.invoices.length + added.payments.length) { try { localStorage.setItem(impKey(), JSON.stringify(added)); } catch (e) {} }
  return added;

function undoImport() {

  k.y += 40; k.hr(); k.y += 46;
  k.t((sup ? "Reste à payer au fournisseur : " : "Reste à payer sur le compte : ") + fmt(x.due), M, k.y, { size: 26, bold: true });
  if (x.credit > 0) { k.y += 42; k.t("Avance : " + fmt(x.credit), M, k.y, { size: 24 }); }

}
function pdfFile(doc, name) { return new File([doc.output("blob")], name, { type: "application/pdf" }); }
function saveFile(file) {

/* Envois WhatsApp déjà faits (retenus sur ce téléphone) : alerte avant un nouvel envoi du même document. */
const sentKey = () => "cc_sent_" + (user ? user.id : "");
function sentLog() { try { return JSON.parse(localStorage.getItem(sentKey()) || "{}"); } catch (e) { return {}; } }
function sendAgain(key, label, tel) {
  const log = sentLog(), l = log[key] || [];
  if (l.length) {
    const last = l[l.length - 1], d = new Date(last.t);
    const when = fd(d.toISOString().slice(0, 10)) + " à " + String(d.getHours()).padStart(2, "0") + "h" + String(d.getMinutes()).padStart(2, "0");
    const same = (last.tel || "") === (tel || "");
    if (!confirm(label + " a déjà été envoyé" + (l.length > 1 ? " " + l.length + " fois" : "") + " (dernier envoi le " + when + (last.tel ? ", au " + last.tel : "") + ")." + (same ? " C'est le même numéro." : "") + " L'envoyer encore ?")) return false;
  }
  l.push({ t: Date.now(), tel: tel || "" }); log[key] = l.slice(-5);
  const keys = Object.keys(log); if (keys.length > 800) keys.sort((a, b) => log[a][log[a].length - 1].t - log[b][log[b].length - 1].t).slice(0, keys.length - 800).forEach(k => delete log[k]);
  try { localStorage.setItem(sentKey(), JSON.stringify(log)); } catch (e) {}
  return true;
}
function showReceipt(pid, again) {
  const p = S.payments.find(x => x.id === pid); if (!p) return;
  const c = S.clients.find(x => x.id === p.cid); if (!c) return;
  const x = calc(c.id), tel = (c.phone || "").replace(/\D/g, ""), fname = "recu-" + p.date + "-" + p.id.slice(0, 6) + ".pdf";
  dlgOpen(`<h2>${again ? "Reçu de paiement" : "Paiement enregistré"}</h2><p class="mut">${esc(c.name)} · ${fmt(p.amt)} · ${fd(p.date)}<br>Reste à payer : ${fmt(x.due)}</p>

}

/* ---------- Code PIN (sur cet appareil) ---------- */
const pinKey = () => "cc_pin_" + (user ? user.id : "");
function getPin() { try { const v = localStorage.getItem(pinKey()); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function setPinRec(rec) { try { if (rec) localStorage.setItem(pinKey(), JSON.stringify(rec)); else localStorage.removeItem(pinKey()); return true; } catch (e) { return false; } }
async function hashPin(pin, salt) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}
const okPin = p => /^[0-9]{4,6}$/.test(p);
function renderLock() {
  app(`<div class="top"><h1>Carnet Clair</h1></div>

  const go = async () => {
    const rec = getPin(), m = $("#pm"), v = $("#pn").value.trim();
    if (!rec) { locked = false; render(); return; }
    if (!v) { m.textContent = "Entrez votre code PIN."; return; }
    if ((await hashPin(v, rec.salt)) === rec.hash) { rec.fails = 0; setPinRec(rec); locked = false; render(); return; }
    rec.fails = (rec.fails || 0) + 1;

/* ---------- Code Authenticator (deuxième facteur) ---------- */
async function mfaGate() { mfaPending = true; const ok = await mfaGate0(); if (ok) mfaPending = false; return ok; }
async function mfaGate0() {
  let lv;
  try { lv = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); } catch (e) { return true; }
  if (lv.error || !lv.data || lv.data.nextLevel !== "aal2" || lv.data.currentLevel === "aal2") return true;
  try {
    const f = await sb.auth.mfa.listFactors();
    if (f.error) throw f.error;
    const t = f.data && f.data.totp && f.data.totp.find(x => x.status === "verified");
    if (!t) return true;
    renderMfa(t.id); return false;
  } catch (e) {
    app(`<div class="top"><h1>Carnet Clair</h1></div><div class="empty">Vérification du code Authenticator impossible. Vérifiez la connexion Internet.</div>
    <div class="acts"><button class="p" id="rt">Réessayer</button><button id="lo">Se déconnecter</button></div>`);
    $("#rt").onclick = async () => { if (await mfaGate()) { locked = false; loadAll(true); } };
    $("#lo").onclick = () => sb.auth.signOut();
    return false;
  }
}

async function adminStepUp() {
  let t = null;
  try {

    if (f.error) { alert("Erreur : " + f.error.message); return; }

  dlgOpen(`<h2>Code Authenticator</h2><p class="mut">L'Administration demande le code de « Carnet Clair » affiché dans Google Authenticator.</p>

async function mfaVerify(factorId, code) {
  const c = await sb.auth.mfa.challenge({ factorId });
  if (c.error) return c.error;
  const v = await sb.auth.mfa.verify({ factorId, challengeId: c.data.id, code });
  return v.error || null;
}

}

  <p class="mut">2. Notez cette clé sur papier, en lieu sûr : elle permet de recréer le code si vous perdez le téléphone.</p>

  $("#mcp").onclick = () => { try { navigator.clipboard.writeText(secret); $("#mcp").textContent = "Copiée"; } catch (x) {} };
  $("#no").onclick = async () => { dlgClose(); await sb.auth.mfa.unenroll({ factorId: fid }); };

/* ---------- Démarrage ---------- */
function boot() {
  if (SUPABASE_URL.indexOf("VOTRE") > -1 || typeof supabase === "undefined") {
    app('<div class="empty">Configuration manquante : ouvrez index.html et remplacez SUPABASE_URL et SUPABASE_KEY (voir GUIDE.md).</div>'); return;
  }
  const sm = location.hash.match(/^#\/r\/([0-9a-fA-F-]{36})$/);
  if (sm) { statementBoot(sm[1]); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev, s) => {
    const u = s && s.user ? s.user : null, changed = (u ? u.id : null) !== (user ? user.id : null);
    if (ev === "PASSWORD_RECOVERY") recovering = true;
    if (recovering && u) { user = u; setTimeout(renderNewPassword, 0); return; }
    if (!changed && ev !== "INITIAL_SESSION") return;
    user = u;
    setTimeout(async () => {
      if (user) {
        if (!(await mfaGate())) return;
        locked = ev === "INITIAL_SESSION" && !!getPin();
        loadAll(true);
      }
      else { mfaPending = false; S = { clients: [], invoices: [], payments: [], cur: "GNF", shop: "" }; sub = null; isAdm = false; cid = null; renderAuth(); }
    }, 0);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (user && !locked && !mfaPending && getPin() && hiddenAt && Date.now() - hiddenAt > 120000) { locked = true; if ($("#dlg").open) $("#dlg").close(); render(); return; }
    if (user && !locked && !mfaPending && !$("#dlg").open) queue = queue.then(() => loadAll(false));
  });
}
boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
