<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Carnet Clair · test de sécurité</title>
<style>
body{margin:0;font:16px/1.45 system-ui,sans-serif;background:#121a17;color:#e9efe9}main{max-width:640px;margin:auto;padding:16px}
h1{font-size:22px;margin:4px 0 6px}p{margin:6px 0}.mut{color:#9aa8a1;font-size:14px}
label{display:block;margin:12px 0 4px;color:#9aa8a1;font-size:14px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2c3a35;background:#1a2420;color:#e9efe9;font-size:16px}
button{margin-top:14px;padding:12px 18px;border-radius:10px;border:0;background:#6fd0bd;color:#0f2a25;font-weight:700;font-size:16px}
.r{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #22302b}.r b{min-width:28px}.ok{color:#6fd0bd}.ko{color:#ff8a7a}
#sum{margin-top:16px;padding:14px;border-radius:12px;background:#1a2420;font-weight:700}
</style></head><body><main>
<h1>Test de sécurité Carnet Clair</h1>
<p class="mut">Cette page essaie de faire ce qui est interdit et vérifie que la base refuse. Aucun essai ne peut toucher aux données des autres commerçants. Utilisez uniquement le <b>compte de test</b> (pas le compte administrateur). Rien n'est modifié si la sécurité fonctionne.</p>
<label for="e">E-mail du compte de test</label><input id="e" type="email" autocomplete="off">
<label for="p">Mot de passe du compte de test</label><input id="p" type="password" autocomplete="off">
<button id="go">Lancer le test</button>
<div id="out"></div><div id="sum" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_ = "https://mphphohljjpqjwnrpuld.supabase.co", KEY = "sb_publishable_Jz2Kt1WlETaj8tSbzbom0w_yZ5SEB-J";
const out = document.getElementById("out"); let pass = 0, fail = 0, n = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function line(ok, txt, detail) { n++; ok ? pass++ : fail++; out.insertAdjacentHTML("beforeend", `<div class="r"><b>${n}</b><span><span class="${ok ? "ok" : "ko"}">${ok ? "✅ Bloqué" : "❌ PROBLÈME"}</span> · ${esc(txt)}${detail ? `<br><span class="mut">${esc(detail)}</span>` : ""}</span></div>`); }
const rid = () => crypto.randomUUID();
async function run() {
  out.innerHTML = ""; pass = fail = n = 0; document.getElementById("sum").hidden = true;
  const email = document.getElementById("e").value.trim(), pw = document.getElementById("p").value;
  if (!email || !pw) { alert("Entrez l'e-mail et le mot de passe du compte de test."); return; }
  const anon = supabase.createClient(URL_, KEY, { auth: { persistSession: false } });
  out.insertAdjacentHTML("beforeend", '<p class="mut">Partie 1 : visiteur non connecté</p>');
  for (const t of ["clients", "invoices", "payments", "profiles", "subscriptions", "admins"]) {
    const r = await anon.from(t).select("*").limit(5);
    line(!!r.error || (r.data || []).length === 0, "Lire la table « " + t + " » sans être connecté", r.error ? "refusé par la base" : (r.data.length + " ligne(s) visibles"));
  }
  let r = await anon.rpc("is_admin"); line(!!r.error || r.data === false, "Appeler is_admin sans être connecté", r.error ? "refusé par la base" : "réponse : " + r.data);
  r = await anon.rpc("get_statement", { t: rid() }); line(!r.error && r.data === null, "Deviner un lien de relevé au hasard", r.error ? r.error.message : "aucun relevé trouvé");
  r = await anon.from("clients").insert({ id: rid(), name: "INTRUS", user_id: rid() }); line(!!r.error, "Créer un client sans être connecté", r.error ? "refusé par la base" : "ACCEPTÉ");
  const sb = supabase.createClient(URL_, KEY, { auth: { persistSession: false } });
  const lg = await sb.auth.signInWithPassword({ email, password: pw });
  if (lg.error) { out.insertAdjacentHTML("beforeend", `<p class="ko">Connexion impossible : ${esc(lg.error.message)}</p>`); return; }
  const me = lg.data.user.id;
  out.insertAdjacentHTML("beforeend", '<p class="mut">Partie 2 : commerçant connecté qui essaie de voir ou modifier ce qui ne lui appartient pas</p>');
  for (const t of ["clients", "invoices", "payments", "profiles", "subscriptions"]) {
    r = await sb.from(t).select("user_id").limit(1000);
    const others = (r.data || []).filter(x => x.user_id !== me).length;
    line(!r.error && others === 0, "Ne voir que ses propres lignes dans « " + t + " »", r.error ? r.error.message : (r.data.length + " ligne(s) à lui, " + others + " à d'autres"));
  }
  r = await sb.from("admins").select("*"); line(!r.error && r.data.length === 0, "Ne pas être administrateur", r.error ? r.error.message : (r.data.length ? "IL EST DANS LA LISTE DES ADMINS" : "pas administrateur"));
  r = await sb.rpc("is_admin"); line(!r.error && r.data === false, "is_admin répond « non »", r.error ? r.error.message : "réponse : " + r.data);
  r = await sb.from("admins").insert({ user_id: me }).select(); line(!!r.error || !(r.data || []).length, "Se déclarer administrateur", r.error ? "refusé par la base" : "ACCEPTÉ : supprimez cette ligne dans la table admins !");
  const s0 = await sb.from("subscriptions").select("*").eq("user_id", me).maybeSingle();
  if (s0.data) {
    r = await sb.from("subscriptions").update({ paid_until: s0.data.paid_until, trial_ends: s0.data.trial_ends }).eq("user_id", me).select();
    line(!!r.error || !(r.data || []).length, "Modifier son propre abonnement (jours gratuits)", r.error ? "refusé par la base" : ((r.data || []).length ? "ACCEPTÉ" : "aucune ligne modifiée"));
  }
  r = await sb.from("subscriptions").delete().eq("user_id", me).select(); line(!!r.error || !(r.data || []).length, "Supprimer son abonnement", r.error ? "refusé par la base" : ((r.data || []).length ? "ACCEPTÉ" : "aucune ligne supprimée"));
  r = await sb.from("clients").insert({ id: rid(), name: "INTRUS", user_id: rid() }).select(); line(!!r.error, "Créer un client au nom d'un autre commerçant", r.error ? "refusé par la base" : "ACCEPTÉ");
  r = await sb.from("invoices").insert({ id: rid(), client_id: rid(), no: "X", date: "2026-01-01", items: [] }).select(); line(!!r.error, "Créer une facture sur le client d'un autre", r.error ? "refusé par la base" : "ACCEPTÉ");
  r = await sb.from("payments").insert({ id: rid(), client_id: rid(), date: "2026-01-01", amt: 1 }).select(); line(!!r.error, "Créer un paiement sur le client d'un autre", r.error ? "refusé par la base" : "ACCEPTÉ");
  await sb.auth.signOut();
  const sum = document.getElementById("sum"); sum.hidden = false;
  sum.innerHTML = fail ? `<span class="ko">${fail} problème(s) sur ${n} essais. Envoyez une capture de toute la page.</span>` : `<span class="ok">${pass} essais sur ${n} bloqués : la sécurité tient.</span>`;
  document.getElementById("p").value = "";
}
document.getElementById("go").onclick = () => run().catch(e => out.insertAdjacentHTML("beforeend", `<p class="ko">Erreur : ${esc(e.message || e)}</p>`));
</script></body></html>
